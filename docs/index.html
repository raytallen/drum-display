const stage=document.querySelector('#stage'),preview=document.querySelector('#preview'),zoom=document.querySelector('#zoom'),nav=document.querySelector('#views');let current=0;
function size(){const ratio=preview.naturalWidth/preview.naturalHeight;if(!ratio)return;const factor=Number(zoom.value)/100;let w=Math.min(stage.clientWidth,stage.clientHeight*ratio)*factor;preview.style.width=w+'px';preview.style.height=w/ratio+'px';document.querySelector('#amount').value=zoom.value+'%'}
function show(index){current=(index+images.length)%images.length;preview.src=images[current].src;preview.alt=images[current].title;zoom.value=100;stage.scrollTo(0,0);document.querySelector('#caption').textContent=(current+1)+' / '+images.length+' · '+images[current].title;[...nav.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));size()}
images.forEach((item,i)=>{let button=document.createElement('button');button.textContent=item.title;button.onclick=()=>show(i);nav.append(button)});
preview.onload=size;zoom.oninput=size;window.addEventListener('resize',size);document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#reset').onclick=()=>{zoom.value=100;size();stage.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,button,a'))return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});show(0);
